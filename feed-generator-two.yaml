apiVersion: v1
kind: Service
metadata:
  name: feed-generator-two
spec:
  selector:
    app: feed-generator-two
  ports:
  - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-generator-two
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feed-generator-two
  template:
    metadata:
      labels:
        app: feed-generator-two
    spec:
      containers:
      - name: feed-generator-two
        image: mak100186/feed-generator-two:1.0.1
        resources:
          limits:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080